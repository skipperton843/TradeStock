<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradeStock | Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-container {
      background: white;
      width: 380px;
      max-width: 90%;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 4px 20px #00000015;
    }

    h1 {
      color: #10233f;
      text-align: center;
      margin-bottom: 8px;
    }

    h2 {
      text-align: center;
      font-size: 20px;
    }

    p {
      text-align: center;
      color: #617087;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border: 1px solid #ccd5e0;
      border-radius: 6px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 12px;
      background: #1677d2;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #095ca8;
    }

    a {
      color: #1677d2;
    }

    .notice {
      font-size: 13px;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="login-container">
    <h1>TradeStock</h1>
    <h2>Customer Login</h2>
    <p>Welcome back! Sign in to your account.</p>

    <form id="loginForm">
      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit">Login</button>
    </form>

    <p>Don't have an account?
      <a href="register.html">Register Here</a>
    </p>

    <p class="notice">
      Demonstration only. Authentication is not
      connected to the database yet.
      Do not enter a real password.
    </p>
  </div>

  <script>
    document.getElementById("loginForm")
      .addEventListener("submit", function(event) {
        event.preventDefault();

        alert(
          "Login interface is working! " +
          "Account verification will be added later."
        );
      });
  </script>
</body>
</html>
